<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12A66A">
<title>Le Tableau – AI training for teachers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>


:root{
  --paper:#F5F8F6; --sheet:#FFFFFF; --grid:transparent; --grid2:transparent;
  --ink:#1F2D2A; --ink2:#5B6B66; --line:#E2E9E5;
  --blue:#1F7AE0; --blue-ink:#FFFFFF; --blue-soft:#E4F0FF; --blue2:#2D9CDB; --blue2-d:#1F7DB5;
  --red:#EE4B4B; --on-red:#FFFFFF; --warn-soft:#FFE7E7; --red-d:#C23030;
  --green:#12A66A; --green-d:#0C7F4F; --on-green:#FFFFFF; --green-soft:#DFF6EA;
  --amber:#FFC93C; --amber-d:#D9A300; --amber-ink:#3A2A00; --gold-soft:#FFF5D6;
  --purple:#8E5CF5;
  --slate:#22343B; --slate2:#2C434C; --chalk:#F3F1E7; --chalk2:#B9C8CC;
  --font-h:'Nunito',ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif;
  --font-b:'Nunito',ui-sans-serif,system-ui,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1614; --sheet:#16211E; --ink:#E8F0EC; --ink2:#9FB2AA; --line:#2A3A35;
    --blue:#7DB4FF; --blue-ink:#0E1614; --blue-soft:#1C2B45; --warn-soft:#3A1F1F; --red:#FF7B72; --on-red:#2A0805;
    --green:#3CCB8B; --green-d:#22A06A; --on-green:#06150E; --green-soft:#17332A; --gold-soft:#3A3115;
    --slate:#0B1311; --slate2:#162521; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1614; --sheet:#16211E; --ink:#E8F0EC; --ink2:#9FB2AA; --line:#2A3A35;
  --blue:#7DB4FF; --blue-ink:#0E1614; --blue-soft:#1C2B45; --warn-soft:#3A1F1F; --red:#FF7B72; --on-red:#2A0805;
  --green:#3CCB8B; --green-d:#22A06A; --on-green:#06150E; --green-soft:#17332A; --gold-soft:#3A3115;
  --slate:#0B1311; --slate2:#162521; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stage :focus-visible,.board :focus-visible,.proj :focus-visible{outline-color:var(--amber)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 16px 18px;border-right:1px solid var(--line);background:var(--sheet);display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:6px;background:var(--slate);display:grid;place-items:center;flex:none}
.mark i{display:block;width:18px;height:2px;background:var(--chalk);box-shadow:0 6px 0 -0px var(--chalk),0 -6px 0 0 var(--amber);border-radius:2px}
.brand b{font:700 20px/1 var(--font-h)}
.brand small{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;font-weight:700;color:var(--ink2);min-height:44px}
.nav button:hover{background:var(--blue-soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.nav svg,.tab svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.weekbox{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}
.weekbox p{margin:0 0 8px;font-size:14px;color:var(--ink2)}
.weekbox p b{color:var(--ink)}
.wk8{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.wk8 i{height:8px;border-radius:2px;background:var(--line)}
.wk8 i.d{background:var(--blue)}.wk8 i.n{background:var(--red)}
.chip-live{display:none;margin-top:12px;background:var(--slate);color:var(--amber);border-radius:6px;padding:8px 10px;font:700 14px var(--font-b);cursor:pointer;border:0;width:100%;text-align:left}
.chip-live.on{display:block}
.desk{background-color:var(--paper);background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px);background-size:32px 32px,32px 32px,32px 8px;padding:28px 28px 64px;min-width:0}
.sheet{max-width:1100px;margin:0 auto;background:var(--sheet);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:4px;padding:30px 34px 38px}
.mbar{display:none}
.tabbar{display:none}

/* type */
h1{font:700 32px/1.1 var(--font-h);letter-spacing:-.01em;margin:0}
h2{font:700 20px/1.2 var(--font-h);margin:0 0 4px}
h3{font:700 16px/1.3 var(--font-b);margin:0 0 6px}
.sub{color:var(--ink2);margin:8px 0 0;max-width:62ch}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink2)}
.sec{margin-top:34px}
.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec>header p{margin:0;color:var(--ink2);font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px var(--font-b);padding:10px 16px;min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.amber{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.chalk{background:transparent;color:var(--chalk);border-color:rgba(243,241,231,.45)}
.btn.chalk:hover{border-color:var(--chalk)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--red)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.linklike{background:none;border:0;padding:0;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linklike:hover{text-decoration-color:var(--blue);color:var(--blue)}

/* ledger */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0 0}
.ledger>div{padding:16px 20px;border-left:1px solid var(--line)}
.ledger>div:first-child{border-left:0;padding-left:0}
.num{font:700 36px/1 var(--font-h);font-variant-numeric:tabular-nums}
.num small{font-size:16px;color:var(--ink2);font-weight:500;margin-left:2px}
.ledger .lab{color:var(--ink2);font-size:14px;margin-top:8px}

/* timeline */
.track{list-style:none;margin:0;padding:0 0 4px;display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));overflow-x:auto}
.track li{position:relative}
.track li::before{content:'';position:absolute;top:19px;left:-50%;width:100%;height:2px;background:var(--line)}
.track li:first-child::before{display:none}
.track li.done::before,.track li.now::before{background:var(--blue)}
.node{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:0 6px;cursor:pointer;color:var(--ink)}
.dot{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--font-h);border:2px solid var(--line);background:var(--sheet);color:var(--ink2)}
.done .dot{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.now .dot{border:3px solid var(--red);color:var(--ink);box-shadow:0 0 0 5px rgba(200,48,42,.14)}
.nt{font-size:13px;line-height:1.25;text-align:center;color:var(--ink2)}
.now .nt{color:var(--ink);font-weight:700}

/* board (dashboard next session) */
.board{background:var(--slate);color:var(--chalk);border-radius:10px;padding:26px 30px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-top:30px;outline:1px solid rgba(243,241,231,.10);outline-offset:-10px}
.board .k{color:var(--chalk2);margin:0;font-size:14px}
.board h2{font-size:30px;margin:6px 0 4px;color:var(--chalk)}
.board .d{margin:0;color:var(--chalk2)}
.steps{list-style:none;padding:0;margin:16px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{font-size:13px;border:1px dashed rgba(243,241,231,.35);border-radius:999px;padding:3px 11px}
.board .go{display:flex;gap:8px;flex-wrap:wrap}

/* columns */
.cols{display:grid;grid-template-columns:1.05fr 1fr;gap:40px}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.bar .col{height:116px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar .col span{display:block;width:100%;max-width:46px;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px}
.bar.cur .col span{background:var(--red)}
.bar.off .col span{background:var(--line)}
.bar b{color:var(--ink)}
.ind{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(70px,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ind:first-child{padding-top:0}
.ind p{margin:0}
.ind small{color:var(--ink2);display:block;font-size:13px}
.meter{height:8px;background:var(--blue-soft);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.meter.ok i{background:var(--green)}
.val{font:700 18px var(--font-h);font-variant-numeric:tabular-nums;text-align:right;min-width:58px}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{display:inline-block;font-size:13px;padding:2px 9px;border-radius:4px;background:var(--warn-soft);color:var(--red);font-weight:700;margin-left:4px}
.chip.ok{background:var(--green-soft);color:var(--green)}
.empty{border:2px dashed var(--line);border-radius:8px;padding:22px;margin-top:22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty p{margin:0;max-width:52ch}

/* toolbar + roster */
.bar-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0 14px}
.bar-tools input,.bar-tools select,.field input,.field select,.field textarea,.field-in{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:9px 12px;min-height:44px}
.bar-tools input[type=search]{min-width:200px;flex:1}
.weeksel{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.weeksel button{border:0;background:var(--sheet);padding:8px 11px;min-height:44px;cursor:pointer;font-weight:700;color:var(--ink2);border-left:1px solid var(--line)}
.weeksel button:first-child{border-left:0}
.weeksel button[aria-pressed=true]{background:var(--blue);color:var(--blue-ink)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font:700 13px var(--font-b);color:var(--ink2);padding:8px 10px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 12px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;min-height:38px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true][data-v=p]{background:var(--green);color:var(--on-green)}
.seg button[aria-pressed=true][data-v=a]{background:var(--red);color:var(--on-red)}
.num-in{width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);min-height:38px}
.tick{width:22px;height:22px;accent-color:var(--blue)}
.pct{font-variant-numeric:tabular-nums;font-weight:700}
.pct.low{color:var(--red)}
.count{color:var(--ink2);font-size:14px;margin:0 0 8px}

/* curriculum */
details.wk{border-top:1px solid var(--line)}
details.wk:last-of-type{border-bottom:1px solid var(--line)}
details.wk summary{list-style:none;display:flex;align-items:center;gap:14px;padding:14px 4px;cursor:pointer;min-height:56px}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary .dot{width:34px;height:34px;font-size:15px;flex:none}
details.wk summary b{font:700 17px var(--font-h)}
details.wk summary small{display:block;color:var(--ink2);font-size:13px}
details.wk .body{padding:4px 4px 22px 52px;display:grid;grid-template-columns:1fr 1fr;gap:18px 32px}
details.wk .body h3{color:var(--blue)}
details.wk ul{margin:0;padding-left:18px}
details.wk li{margin-bottom:4px}
.tag{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:4px;padding:1px 8px;color:var(--ink2);margin-left:6px}
.full{grid-column:1/-1}
.note{background:var(--blue-soft);border-radius:6px;padding:10px 14px;color:var(--ink);font-size:14px;margin:18px 0 0}

/* session runner */
.stage{background:var(--slate);color:var(--chalk);border-radius:12px;padding:26px 30px 24px;margin-top:20px;outline:1px solid rgba(243,241,231,.10);outline-offset:-10px}
.stage .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.stage .kk{color:var(--chalk2);margin:0;font-size:14px}
.stage h2{color:var(--chalk);font-size:26px;margin:2px 0 0}
.clock{color:var(--chalk2);font-size:14px;font-variant-numeric:tabular-nums}
.timer{font:700 clamp(68px,15vw,136px)/1 var(--font-h);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:14px 0 4px}
.timer.over{color:#FF8A80}
.segs{display:flex;gap:4px;margin:12px 0 18px}
.sg{position:relative;height:16px;border:0;border-radius:3px;background:rgba(243,241,231,.14);overflow:hidden;cursor:pointer;padding:0}
.sg i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,216,77,.8)}
.sg.done i{background:rgba(243,241,231,.45)}
.sg.cur{outline:2px solid var(--amber);outline-offset:1px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.flash{animation:flash .8s 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(255,216,77,0)}50%{box-shadow:0 0 0 8px rgba(255,216,77,.55)}}
.runcols{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin-top:28px}
.board-list{margin:0;padding:0;list-style:none}
.board-list li{padding:10px 0 10px 22px;position:relative;border-bottom:1px dashed var(--line);font-size:18px;line-height:1.4}
.board-list li::before{content:'';position:absolute;left:2px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.plan li .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font-h);border:2px solid var(--line);flex:none}
.plan li.cur .n{border-color:var(--red);color:var(--red)}
.plan li.done .n{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.plan li.cur{font-weight:700}
.plan li span:last-child{margin-left:auto;color:var(--ink2);font-size:14px}
.tip{background:var(--blue-soft);border-radius:6px;padding:12px 14px;margin:0 0 16px}
.keys{color:var(--ink2);font-size:13px;margin-top:14px}
kbd{font:700 12px var(--font-b);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--sheet)}

/* projector */
.proj{position:fixed;inset:0;z-index:60;background:var(--slate);color:var(--chalk);display:flex;flex-direction:column;padding:calc(26px + env(safe-area-inset-top,0px)) 44px calc(26px + env(safe-area-inset-bottom,0px));gap:14px;overflow:auto}
.proj .ph{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.proj .ph p{margin:0;color:var(--chalk2);font-size:18px}
.proj .pt{font:700 clamp(30px,5vw,60px)/1.05 var(--font-h);margin:0}
.proj .ptm{font:700 clamp(54px,9vw,120px)/1 var(--font-h);font-variant-numeric:tabular-nums}
.proj .ptm.over{color:#FF8A80}
.proj ul{list-style:none;margin:6px 0 0;padding:0;flex:1}
.proj li{font-size:clamp(22px,3.1vw,42px);line-height:1.25;padding:10px 0 10px 40px;position:relative}
.proj li::before{content:'';position:absolute;left:6px;top:calc(.62em + 10px);width:.4em;height:.4em;border-radius:50%;background:var(--amber)}
.proj .pc{display:flex;gap:8px;flex-wrap:wrap}

/* prompt lab */
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:22px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700}
.field small{display:block;color:var(--ink2);margin-bottom:4px;font-size:13px}
.field textarea{width:100%;min-height:62px;resize:vertical;font-size:16px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;min-height:38px}
.presets button:hover{border-color:var(--blue);color:var(--blue)}
.prompt{background:var(--slate);color:var(--chalk);border-radius:10px;padding:18px 20px;white-space:pre-wrap;font-size:16px;min-height:120px;margin:8px 0 12px;word-break:break-word}
.prompt.ph{color:var(--chalk2);font-style:italic}
.parts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.parts span{font-size:13px;border:1px solid var(--line);border-radius:4px;padding:2px 9px;color:var(--ink2)}
.parts span.on{background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:700}
.out{border-left:3px solid var(--blue);padding:4px 0 4px 16px;margin-top:16px;white-space:pre-wrap;word-break:break-word}

/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);padding:24px;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,15,22,.55)}
dialog h2{margin-bottom:12px}
dialog textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--paper);font:14px/1.5 var(--font-b)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;z-index:80;font-weight:700;max-width:calc(100vw - 32px)}
.setrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:first-of-type{padding-top:0}
.setrow p{margin:0}

@media (max-width:1000px){
  .ledger{grid-template-columns:1fr 1fr}
  .ledger>div:nth-child(3){border-left:0;padding-left:0}
  .ledger>div:nth-child(n+3){border-top:1px solid var(--line)}
  .cols,.runcols,.labgrid{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}

  if(SAMPLE)return SAMPLE(prompt,opts).then(function(r){return r.text});
  if(CFG.aiEndpoint)return fetch(CFG.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt}),signal:opts.signal}).then(function(r){if(!r.ok)throw {code:'error'};return r.json()}).then(function(j){if(opts.onText)opts.onText({text:j.text});return j.text});
  return Promise.reject({code:'unavailable'});
}
function aiJSON(prompt,opts){
  opts=opts||{};
  if(SAMPLE&&SAMPLE.json)return SAMPLE.json(prompt,opts);
  return aiText(prompt+'\n\nRéponds uniquement avec un objet JSON valide.',opts).then(function(t){
    var m=t.replace(/```json|```/g,'').trim();var a=m.indexOf('{'),b=m.lastIndexOf('}');
    try{return JSON.parse(m.slice(a,b+1))}catch(e){throw {code:'invalid_json'}}
  });
}
function aiErr(e){
  var c=e&&e.code;
  if(c==='not_granted')return L('Permission is needed to ask Claude from this page.','Une autorisation est nécessaire pour interroger Claude depuis cette page.');
  if(c==='rate_limited')return L('Too many requests. Wait a moment and try again.','Trop de requêtes. Patientez un instant puis réessayez.');
  if(c==='unavailable')return L('AI is not available in this view.','L’IA n’est pas disponible dans cette vue.');
  if(c==='invalid_json')return L('The lesson came back in an unexpected format. Try again.','La leçon est revenue dans un format inattendu. Réessayez.');
  return L('The answer could not be generated. Try again.','La réponse n’a pas pu être générée. Réessayez.');
}

var run=null,ticker=null;
function newRun(w){return {w:w,i:0,rem:STEPS[0].min*60,spent:[0,0,0,0,0],running:false,last:0,warned:false,started:false,done:false}}
function ensureRun(){if(!run||run.w!==S.week)run=newRun(S.week);return run}
function elapsed(){return run?run.spent.reduce(function(a,b){return a+b},0):0}
function setStep(i){ensureRun();i=clamp(i,0,STEPS.length-1);run.i=i;run.rem=STEPS[i].min*60-run.spent[i];run.warned=run.rem<=0;run.last=Date.now();paintStepChange()}
function toggleRun(){ensureRun();if(run.done){run=newRun(S.week)}run.running=!run.running;run.started=true;run.last=Date.now();paintStepChange()}
function finishRun(){ensureRun();run.running=false;run.done=true;toast(L('Session finished. Take attendance now.','Séance terminée. Faites l’appel maintenant.'));closeProj();go('people')}
function startTicker(){if(ticker)return;ticker=setInterval(function(){if(run&&run.running){var now=Date.now(),d=(now-run.last)/1000;run.last=now;run.rem-=d;run.spent[run.i]+=d;if(!run.warned&&run.rem<=0){run.warned=true;stepEnded()}paintTimer()}},250)}
function stepEnded(){var s=STEPS[run.i];$('#live').textContent=L('Time is up: ','Temps écoulé : ')+L(s.en,s.fr);try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}var el=$('#stage')||$('#proj');if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}

/* ---------- session ---------- */
function weekSel(){var h='<div class="weeksel" role="group" aria-label="'+L('Week','Semaine')+'">';for(var w=1;w<=8;w++)h+='<button data-act="week" data-w="'+w+'" aria-pressed="'+(w===S.week)+'" aria-label="'+L('Week ','Semaine ')+w+'">'+L('W','S')+w+'</button>';return h+'</div>'}

function stepContent(w,i){
  var W=WEEKS[w-1],s=STEPS[i].k,items=[];
  if(s==='review'){if(w===1)items=[L('Welcome and introductions','Accueil et présentations'),L('What each participant expects from the course','Les attentes de chaque participant'),L('Ground rules: phones, timing, respect','Règles du groupe : téléphones, horaires, respect')];else items=[L('What did you try this week?','Qu’avez-vous essayé cette semaine ?'),L('Take-home task: ','Pratique demandée : ')+WEEKS[w-2].entre,L('Common difficulties go on the board','Les difficultés fréquentes vont au tableau')]}
  else if(s==='input')items=W.cont;
  else if(s==='lab')items=W.act;
  else if(s==='share')items=[L('Each pair presents its work in two minutes','Chaque binôme présente son travail en deux minutes'),L('Group feedback: one strength, one improvement','Retour du groupe : un point fort, une amélioration'),L('Deliverable: ','Production attendue : ')+W.prod];
  else items=[L('Three key ideas from today','Trois idées clés d’aujourd’hui'),L('Take-home task: ','Pratique entre les séances : ')+W.entre,w<8?L('Next week: ','Semaine prochaine : ')+WEEKS[w].title:L('Certificates and next steps','Attestations et suites')];
  return items;
}

  var lines=[L('Le Tableau – Progress report','Le Tableau – Rapport d’avancement'),L('AI training for teachers, Guinea. Week ','Formation à l’IA des enseignants, Guinée. Semaine ')+S.week+L(' of 8',' sur 8'),'',
   L('Participants: ','Participants : ')+n+' ('+L('primary ','primaire ')+pr+', collège '+(n-pr)+')',L('By site: ','Par site : ')+bySite,
   L('Average attendance: ','Présence moyenne : ')+(av==null?'—':av+'%'),L('On track (80% attendance or more): ','Dans les clous (80 % de présence ou plus) : ')+(ok.length?tr+'/'+ok.length:'—'),
   L('Portfolio work handed in: ','Productions remises : ')+(dv?dv.pct+'% ('+dv.done+'/'+dv.exp+')':'—'),
   L('Learning path lessons completed: ','Leçons du parcours terminées : ')+list.reduce(function(a,l){return a+lessonsDone(l)},0)+'/'+(n*TOTAL_LESSONS),
   L('Pre/post gain: ','Gain pré/post : ')+(g?(g.v>=0?'+':'')+Math.round(g.v)+' points (n='+g.n+')':'—'),
   L('Certificates issued: ','Attestations délivrées : ')+cert,
   L('Satisfaction: ','Satisfaction : ')+(S.satisfaction==null?'—':S.satisfaction+'%'),L('Women among participants: ','Femmes parmi les participants : ')+(ws?ws.pct+'%':'—')];
  return lines.join('\n');
}
function csvText(){
  var q=function(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var h=['Name','Site','Level','Gender'];for(var w=1;w<=8;w++)h.push('Attendance W'+w);for(w=1;w<=8;w++)h.push('Work W'+w);h.push('Pre-test','Post-test','Attendance %','Lessons done','XP','Certificate');
  var out=[h.join(',')];
  learnersList().forEach(function(l){var r=[l.name,l.site,l.level==='c'?'College':'Primary',l.gender==='f'?'F':l.gender==='m'?'M':''];for(var w=1;w<=8;w++)r.push(l.att&&l.att[w]==='p'?'P':l.att&&l.att[w]==='a'?'A':'');for(w=1;w<=8;w++)r.push(delivDone(l,w)?1:0);var ar=attRate(l);r.push(l.pre==null?'':l.pre,l.post==null?'':l.post,ar==null?'':Math.round(ar*100),lessonsDone(l),l.xp||0,l.cert?l.cert.id:'');out.push(r.map(q).join(','))});
  return '\uFEFF'+out.join('\n');
}
function demoData(){
  var fn=['Mariama','Mamadou','Fanta','Ibrahima','Aissatou','Sékou','Kadiatou','Alpha','Fatoumata','Ousmane','Hawa','Moussa','Néné','Boubacar','Djénabou','Thierno','Kadidja','Abdoulaye','Salématou','Lansana','Nantenin','Facinet','Mariam','Mohamed','Aminata','Sory','Binta','Mory','Safiatou','Karamoko'];
  var ln=['Camara','Diallo','Barry','Bah','Sylla','Soumah','Touré','Keïta','Condé','Traoré','Sow','Bangoura','Kourouma','Koivogui','Doumbouya'];
  var seed=7;var rnd=function(){seed=(seed*16807)%2147483647;return seed/2147483647};
  return fn.map(function(f,i){var p=newLearner({name:f+' '+ln[Math.floor(rnd()*ln.length)],site:S.sites[i%S.sites.length],level:i%2?'c':'p',gender:rnd()<0.45?'f':'m'});p.id='demo_'+uid();p.demo=true;p.pre=Math.round(25+rnd()*30);
    var base=0.62+rnd()*0.38,done=0;for(var w=1;w<=4;w++){p.att[w]=rnd()<base?'p':'a';if(p.att[w]==='p'&&rnd()<0.82)p.del[w]=true;if(rnd()<base){for(var k=0;k<3&&rnd()<0.85;k++){p.lessons[LESSONS[w-1][k].id.replace('.','_')]={d:1,a:0.75+rnd()*0.25,s:2,t:Date.now()};done++}}}
    p.xp=done*22+Math.round(rnd()*40);p.streak=Math.floor(rnd()*6);return p});
}

/* ---------- timer painting ---------- */
function paintTimer(full){
  if(!run)return;var st=STEPS[run.i],over=run.rem<0;
  var n=$('#tmNum');if(n){n.textContent=fmt(run.rem);n.classList.toggle('over',over)}
  var c=$('#clock');if(c)c.textContent=L('Session clock ','Horloge de séance ')+fmt(elapsed()).replace(/^\+?/,'')+' / '+fmt(TOTAL*60);
  var b=$('#btnRun');if(b)b.innerHTML=(run.running?IC.pause+L('Pause','Pause'):IC.go+(run.started&&!run.done?L('Resume','Reprendre'):L('Start','Démarrer')));
  STEPS.forEach(function(s,i){var f=$('#sgf'+i);if(f)f.style.width=(i<run.i?100:i===run.i?clamp(run.spent[i]/(s.min*60)*100,0,100):0)+'%'});
  var pn=$('#pTm');if(pn){pn.textContent=fmt(run.rem);pn.classList.toggle('over',over)}
  paintChip();
}
function paintStepChange(){
  if(S.view==='session'){render()}
  else paintTimer();
  if($('#proj')&&!$('#proj').hidden)renderProj();
  paintTimer();
}
function paintChip(){var c=$('#chipLive');if(!c)return;var on=run&&(run.running||(run.started&&!run.done));c.classList.toggle('on',!!on);if(on)c.textContent=(run.running?'▶ ':'❚❚ ')+L('Session','Séance')+' · '+fmt(run.rem)}

function lessonState(l,w,i,cw){
  var x=LESSONS[w-1][i];if(lessonDone(l,x))return 'done';if(w>cw)return 'locked';if(i===0)return 'open';
  return lessonDone(l,LESSONS[w-1][i-1])?'open':'locked';
}
function missionState(l,w,cw){if(l.pf&&l.pf[w])return 'done';if(w>cw)return 'locked';return LESSONS[w-1].every(function(x){return lessonDone(l,x)})?'open':'locked'}
var POS=[0,34,50,34];

  var l=me(),cw=curWeek(),h='';
  if(D.preview)h+='<div class="pvbar"><span>'+IC.eye+' '+L('Preview mode. Nothing here is saved to the cohort.','Mode aperçu. Rien n’est enregistré dans la cohorte.')+'</span><span><button class="btn3 sm" data-act="previewReset">'+L('Reset','Réinitialiser')+'</button> <button class="btn3 sm blue" data-act="previewOff">'+L('Exit','Quitter')+'</button></span></div>';
  var e=l.tests||{};
  if(!(e.pre&&e.pre.s!=null))h+='<section class="tcard hl"><div>'+mascot('think',56)+'</div><div><b>'+L('Start with a quick quiz','Commencez par un court quiz')+'</b><p>'+L('10 questions to see where you are today. +20 XP.','10 questions pour voir où vous en êtes. +20 XP.')+'</p><button class="btn3 green" data-act="startTest" data-v="pre">'+L('Take the quiz','Passer le quiz')+'</button></div></section>';
  var cur=null;
  for(var w=1;w<=8;w++){

    h+='<section class="unit u'+mc+(locked?' lockedu':'')+'"><div class="uhead"><div><p class="uk">'+L(MODS[W.mod][0],MODS[W.mod][1])+'</p><h2>'+L('Week ','Semaine ')+w+' · '+esc(L(W.en,W.fr))+'</h2></div><span class="ubadge">'+(locked?'🔒':w===cw?L('This week','Cette semaine'):'')+'</span></div><div class="pathw">';
    var nodes=LESSONS[w-1].map(function(x,i){return {k:'l',i:i,x:x,s:lessonState(l,w,i,cw)}});

    nodes.forEach(function(n,idx){

      h+='<div class="pn pos'+(idx%4)+'">'+(isCur?'<span class="startb">'+L('Start','Commencer')+'</span>':'')+'<button class="pnode '+n.s+(isCur?' cur':'')+(n.k==='m'?' mis':'')+'" data-act="'+(n.k==='l'?'openLesson':'openMission')+'" data-w="'+w+'" data-i="'+(n.i||0)+'" aria-label="'+esc(ttl)+(n.s==='locked'?', '+L('locked','verrouillé'):n.s==='done'?', '+L('done','terminé'):'')+'"><span>'+(n.s==='locked'?'🔒':ic)+'</span></button>'+stars+'<span class="pl">'+esc(ttl)+'</span></div>';

var P=null,M=null;
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t}return b}
function prepEx(t){
  var k=t[0];
  if(k==='mcq')return {k:'mcq',q:t[1],opts:shuffle(t[2].map(function(x,i){return {t:x,c:i===t[3]}})),why:t[4]};
  if(k==='tf')return {k:'tf',q:t[1],a:t[2],why:t[3]};
  var items=t[2].slice(),bank=shuffle(items);if(items.length>1&&bank.join('|')===items.join('|'))bank=items.slice().reverse();
  return {k:'ord',q:t[1],items:items,bank:bank,why:t[3]||''};
}
function resetSel(){P.sel=null;P.ord=[];P.used=[];P.checked=false;P.ok=null}
function startLesson(w,i){
  var x=LESSONS[w-1][i];
  P={kind:'lesson',id:lk(x),w:w,i:i,title:x.t,ic:x.ic,cards:x.cards,ci:0,q:x.ex.map(prepEx),n:x.ex.length,pos:0,right:0,phase:x.cards.length?'cards':'ex'};resetSel();openPlayer();
}
function startTest(kind){
  var form=kind==='pre'?'A':'B';
  P={kind:'test',tk:kind,title:kind==='pre'?L('Starting quiz','Quiz de départ'):L('Final quiz','Quiz final'),cards:[],ci:0,q:TESTS[form].map(prepEx),n:TESTS[form].length,pos:0,right:0,phase:'ex'};resetSel();openPlayer();
}
function openPlayer(){var p=$('#player');p.hidden=false;document.body.classList.add('noscroll');renderPlayer()}
function closePlayer(){var p=$('#player');p.hidden=true;p.innerHTML='';document.body.classList.remove('noscroll');P=null;M=null}
function isCorrect(ex){if(ex.k==='mcq')return P.sel!=null&&ex.opts[P.sel].c;if(ex.k==='tf')return P.sel===ex.a;return P.ord.map(function(o){return o.t}).join('|')===ex.items.join('|')}
function canCheck(ex){if(ex.k==='ord')return P.ord.length===ex.items.length;return P.sel!=null}
function renderPlayer(){
  var p=$('#player');if(!P){return}
  var total=P.n+(P.extra||0),prog=P.phase==='done'?100:Math.round(P.pos/Math.max(total,1)*100);
  var top='<div class="ptop"><button class="px" data-act="pClose" aria-label="'+L('Close','Fermer')+'">✕</button><div class="pbar"><i style="width:'+prog+'%"></i></div></div>';
  var body='',bar='';
  if(P.phase==='cards'){
    var c=P.cards[P.ci];
    body='<div class="pbody"><p class="pk">'+P.ic+' '+esc(P.title)+' · '+(P.ci+1)+'/'+P.cards.length+'</p><div class="mrow">'+mascot('happy',72)+'<div class="bubble"><h2>'+esc(c[0])+'</h2><p>'+esc(c[1])+'</p></div></div></div>';
    bar='<div class="pbar2b"><button class="btn3 green wide" data-act="pCardNext">'+L('Continue','Continuer')+'</button></div>';
  }else if(P.phase==='ex'){
    var ex=P.q[P.pos],lab=ex.k==='mcq'?L('Choose the right answer','Choisissez la bonne réponse'):ex.k==='tf'?L('True or false?','Vrai ou faux ?'):L('Put in the right order','Remettez dans le bon ordre');
    var opts='';
    if(ex.k==='mcq')opts='<div class="opts">'+ex.opts.map(function(o,i){var cl='opt';if(P.sel===i)cl+=' sel';if(P.checked&&o.c)cl+=' right';if(P.checked&&P.sel===i&&!o.c)cl+=' wrong';return '<button class="'+cl+'" data-act="pOpt" data-i="'+i+'"'+(P.checked?' disabled':'')+'><span class="kb">'+(i+1)+'</span><span>'+esc(o.t)+'</span></button>'}).join('')+'</div>';
    else if(ex.k==='tf')opts='<div class="opts tf">'+[true,false].map(function(v){var cl='opt';if(P.sel===v)cl+=' sel';if(P.checked&&ex.a===v)cl+=' right';if(P.checked&&P.sel===v&&ex.a!==v)cl+=' wrong';return '<button class="'+cl+'" data-act="pTF" data-v="'+v+'"'+(P.checked?' disabled':'')+'>'+(v?L('True','Vrai'):L('False','Faux'))+'</button>'}).join('')+'</div>';
    else opts='<div class="ordline" aria-label="'+L('Your answer','Votre réponse')+'">'+(P.ord.length?P.ord.map(function(o,pi){return '<button class="chipo" data-act="pOrdDel" data-p="'+pi+'"'+(P.checked?' disabled':'')+'>'+esc(o.t)+'</button>'}).join(''):'<span class="muted">'+L('Tap the pieces below in order.','Touchez les éléments ci-dessous dans l’ordre.')+'</span>')+'</div><div class="ordbank">'+ex.bank.map(function(t,i){return '<button class="chipo'+(P.used[i]?' used':'')+'" data-act="pOrdAdd" data-i="'+i+'"'+(P.used[i]||P.checked?' disabled':'')+'>'+esc(t)+'</button>'}).join('')+'</div>';
    body='<div class="pbody"><p class="pk">'+lab+'</p><h2 class="pq">'+esc(ex.q)+'</h2>'+opts+'</div>';
    if(P.kind==='test'){bar='<div class="pbar2b"><button class="btn3 green wide" data-act="pTestNext"'+(canCheck(ex)?'':' disabled')+'>'+(P.pos>=P.q.length-1?L('Finish','Terminer'):L('Continue','Continuer'))+'</button></div>'}
    else if(!P.checked)bar='<div class="pbar2b"><button class="btn3 green wide" data-act="pCheck"'+(canCheck(ex)?'':' disabled')+'>'+L('Check','Vérifier')+'</button></div>';
    else bar='<div class="fb '+(P.ok?'ok':'bad')+'"><div class="fbt"><b>'+(P.ok?pick([L('Well done!','Bravo !'),L('Great job!','Excellent !'),L('Correct!','Exact !')]):L('Not quite','Pas tout à fait'))+'</b><p>'+esc(ex.why||(P.ok?'':L('Review the answer and try again at the end.','Relisez la réponse, vous réessaierez à la fin.')))+'</p></div><button class="btn3 '+(P.ok?'green':'red')+' wide" data-act="pNext">'+L('Continue','Continuer')+'</button></div>';
  }else if(P.phase==='done'){
    var r=P.result;
    if(P.kind==='test'){
      body='<div class="pbody center">'+mascot('cheer',110)+'<h2>'+(P.tk==='pre'?L('Quiz done!','Quiz terminé !'):L('Final quiz done!','Quiz final terminé !'))+'</h2><div class="bigscore">'+r.score+'%</div><p>'+r.right+' / '+P.n+' '+L('correct answers','bonnes réponses')+'</p>'+(r.delta!=null?'<p class="gainp">'+(r.delta>=0?'+':'')+r.delta+' '+L('points since the start','points depuis le début')+'</p>':'')+'<p class="xpb">+'+r.xp+' XP</p></div>';
    }else{
      body='<div class="pbody center">'+mascot('cheer',110)+'<h2>'+L('Lesson complete!','Leçon terminée !')+'</h2><div class="stars big">'+'★'.repeat(r.stars)+'<i>'+'★'.repeat(3-r.stars)+'</i></div><div class="sumrow"><div><b>⚡ +'+r.xp+'</b><small>XP</small></div><div><b>🎯 '+Math.round(r.acc*100)+'%</b><small>'+L('accuracy','précision')+'</small></div><div><b>🔥 '+r.streak+'</b><small>'+L('day streak','jours de suite')+'</small></div></div></div>';
    }
    bar='<div class="pbar2b"><button class="btn3 green wide" data-act="pDone">'+L('Continue','Continuer')+'</button></div>';
  }
  p.innerHTML=top+body+bar;
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function finishLesson(){
  var l=me(),id=P.id,prev=l.lessons&&l.lessons[id],first=!(prev&&prev.d),acc=P.right/P.n,stars=acc>=0.9?3:acc>=0.7?2:1;
  var xp=first?(10+2*P.right+(acc===1?5:0)):0,st=bumpStreakPatch(l),o={};
  o[id]={d:1,a:Math.max(acc,prev&&prev.a||0),s:Math.max(stars,prev&&prev.s||0),t:Date.now()};
  patch(meId(),{lessons:o,xp:(l.xp||0)+xp,streak:st.streak,last:st.last});
  P.result={xp:xp,acc:acc,stars:stars,streak:st.streak};P.phase='done';renderPlayer();confetti();
}
function finishTest(){
  var l=me(),score=Math.round(P.right/P.n*100),tk=P.tk,first=!(l.tests&&l.tests[tk]&&l.tests[tk].s!=null),xp=first?20:0,st=bumpStreakPatch(l),o={};
  o[tk]={s:score,at:Date.now(),n:P.n};var pt={tests:o,xp:(l.xp||0)+xp,streak:st.streak,last:st.last};pt[tk]=score;
  patch(meId(),pt);
  var delta=tk==='post'&&l.tests&&l.tests.pre&&l.tests.pre.s!=null?score-l.tests.pre.s:null;
  P.result={score:score,right:P.right,xp:xp,delta:delta};P.phase='done';renderPlayer();confetti();
}

function facView(){switch(S.view){case 'session':return vSession();case 'curr':return vCurr();case 'people':return vPeople();case 'studio':return vStudio();case 'settings':return vSettings();default:return vDash()}}
function render(){
  document.documentElement.lang=S.lang;
  if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);
  var app=$('#app'),r=roleNow();
  if(!D.booted){app.innerHTML='<div class="splash"><div>'+mascot('think',96)+'<p class="muted">'+L('Loading…','Chargement…')+'</p></div></div>';return}
  if(!r){app.innerHTML=chooserHTML();return}
  if(r==='teacher'){
    if(D.cloud&&!D.ready&&!me()){app.innerHTML='<div class="splash"><div>'+mascot('think',96)+'<p class="muted">'+L('Opening your path…','Ouverture de votre parcours…')+'</p></div></div>';return}
    if(!me()){app.innerHTML=onboardHTML();return}
    app.innerHTML=teacherShell();
    if(S.tview==='studio')studioPaint();
    paintSync();return;
  }
  app.innerHTML='<div class="app">'+facSide()+'<main class="desk" id="main"><div class="sheet" id="sheet">'+facMbar()+facView()+'</div></main></div>'+facTab();
  if(S.view==='people'&&S.ptab!=='certs')drawRoster();
  if(S.view==='studio')studioPaint();
  if(S.view==='session')paintTimer(true);
  paintChip();paintSync();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='fsite'){ui.site=el.value;drawRoster();return}
  if(el.id==='flevel'){ui.level=el.value;drawRoster();return}
  var b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==='sat'){S.satisfaction=el.value===''?null:clamp(Math.round(+el.value),0,100);save();render();return}
  if(b==='gen'){S.gen[el.dataset.k]=el.dataset.k==='dur'?+el.value:el.value;save();return}
  if(b==='del'){var o={};o[S.week]=el.checked?true:null;patch(el.dataset.id,{del:o});drawRoster();return}
  if(b==='pre'||b==='post'){var pt={};pt[b]=el.value===''?null:clamp(Math.round(+el.value),0,100);patch(el.dataset.id,pt);return}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='q'){ui.q=el.value;drawRoster();return}
  var b=el.dataset&&el.dataset.bind;if(!b)return;
  if(b==='lab'){S.lab[el.dataset.k]=el.value;saveSoon();paintLab();return}
  if(b==='gen'){S.gen[el.dataset.k]=el.value;saveSoon();return}
  if(b==='trainer'){S.trainer[el.dataset.k]=el.value;saveSoon();publishCohort();return}
  if(b==='draft'&&M){M.text=el.value;S.drafts=S.drafts||{};S.drafts[M.w]=el.value;saveSoon();paintMission();return}
});
document.addEventListener('keydown',function(e){
  var tg=e.target,tag=tg&&tg.tagName,typing=(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT');
  if(e.key==='Escape'){var pp=$('#pop');if(pp&&!pp.hidden){ACT.popClose();return}}
  if(P&&!$('#player').hidden&&!typing&&!(dlg&&dlg.open)){
    if(e.key==='Enter'){var b=$('#player .pbar2b .btn3:not([disabled]), #player .fb .btn3');if(b){e.preventDefault();b.click()}return}
    if(P.phase==='ex'&&!P.checked){var ex=P.q[P.pos];if(ex.k==='mcq'&&/^[1-9]$/.test(e.key)&&+e.key<=ex.opts.length){P.sel=+e.key-1;renderPlayer()}if(ex.k==='tf'&&(e.key==='v'||e.key==='V'||e.key==='t'||e.key==='T')){P.sel=true;renderPlayer()}if(ex.k==='tf'&&(e.key==='f'||e.key==='F')){P.sel=false;renderPlayer()}}
    return;
  }
  if(typing||(dlg&&dlg.open)||roleNow()!=='facilitator')return;
  var proj=!$('#proj').hidden;
  if(e.key==='Escape'&&proj){closeProj();return}
  if(S.view!=='session'&&!proj)return;
  if(e.key===' '){e.preventDefault();toggleRun()}
  else if(e.key==='ArrowRight'){e.preventDefault();ensureRun();if(run.i>=STEPS.length-1)finishRun();else setStep(run.i+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();ensureRun();setStep(run.i-1)}
  else if(e.key==='p'||e.key==='P'){proj?closeProj():openProj()}
});
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement){var p=$('#proj');if(p&&!p.hidden)p.hidden=true}});
window.addEventListener('pagehide',save);
window.addEventListener('beforeunload',save);

/* ---------- startup ---------- */
render();
initCloud().then(function(){
  D.booted=true;if(!D.cloud)D.ready=true;
  if(D.cloud&&D.role==='teacher'&&!D.ready)setTimeout(function(){if(!D.ready){D.ready=true;refresh()}},5000);
  render();startTicker();ensureCerts();flush();
},function(){D.booted=true;D.ready=true;D.role=S.role;render();startTicker()});
})();
</script>
</body>
</html>
